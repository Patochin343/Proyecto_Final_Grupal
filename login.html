<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanchaMaster | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<script src="js/app.js"></script>
<body>
    <header class="main-header">
        <div class="container nav-container">
            <a href="index.html" class="logo">CanchaMaster ⚽</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="canchas.html">Canchas</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="login.html" class="active btn-nav">Iniciar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <section class="login-container" style="max-width: 400px; margin: 0 auto;">
            <h1>Bienvenido de nuevo</h1>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="usuario">Usuario / Email:</label>
                    <input type="text" id="usuario" name="usuario" required style="width: 100%; padding: 8px; margin-bottom: 10px;">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; margin-bottom: 20px;">
                </div>
                <button type="submit" style="width: 100%; padding: 10px;">Entrar</button>
            </form>
            <p>¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 CanchaMaster.</p>
        </div>
    </footer>
</body>
</html>
