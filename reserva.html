<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanchaMaster | Reservar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container nav-container">
            <a href="index.html" class="logo">CanchaMaster ⚽</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="canchas.html">Canchas</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="login.html" class="btn btn-nav">Iniciar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <h1 class="page-title">Finalizar Reserva</h1>
        
        <div class="reserva-layout">
            <section class="reserva-form-container">
                <form action="/api/reservar" method="POST" id="formReserva">
                    <fieldset>
                        <legend>1. Tus Datos</legend>
                        <div class="form-group">
                            <label for="nombre">Nombre Completo:</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" required placeholder="Ej: Juan Pérez">
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico:</label>
                            <input type="email" id="email" name="email" class="form-control" required placeholder="juan@ejemplo.com">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>2. Detalles del Partido</legend>
                        <div class="form-group">
                            <label for="cancha-seleccionada">Cancha:</label>
                            <select id="cancha-seleccionada" name="cancha_id" class="form-control">
                                <option value="f7-campin">El Campín - Fútbol 7</option>
                                <option value="basket-norte">Complejo Norte - Basket</option>
                                <option value="padel-center">Padel Center</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="fecha">Fecha:</label>
                                <input type="date" id="fecha" name="fecha" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="hora">Hora:</label>
                                <input type="time" id="hora" name="hora" class="form-control" required min="09:00" max="23:00">
                            </div>
                        </div>
                    </fieldset>
                    
                    <button type="submit" class="btn btn-primary btn-block">Confirmar y Pagar</button>
                </form>
            </section>

            <aside class="reserva-summary">
                <h3>Resumen</h3>
                <div id="summary-content">
                    <p>Selecciona una fecha para ver el total.</p>
                </div>
            </aside>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 CanchaMaster.</p>
        </div>
    </footer>
    <script src="js/app.js" defer></script>
</body>
</html>
