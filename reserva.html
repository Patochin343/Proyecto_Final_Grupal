<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanchaMaster | Reservar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<script src="js/app.js"></script>
<body>
    <header class="main-header">
        <div class="container nav-container">
            <a href="index.html" class="logo">CanchaMaster ⚽</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="canchas.html" class="active">Canchas</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="login.html" class="btn-nav">Iniciar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <h1>Confirmar Reserva</h1>
        
        <section class="reserva-form-container">
            <form action="#" method="POST">
                <fieldset>
                    <legend>Tus Datos</legend>
                    <div class="form-group">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" required placeholder="juan@ejemplo.com">
                    </div>
                </fieldset>

                <br>

                <fieldset>
                    <legend>Detalles del Partido</legend>
                    <div class="form-group">
                        <label for="cancha-seleccionada">Cancha:</label>
                        <select id="cancha-seleccionada" name="cancha">
                            <option value="f7-campin">El Campín - Fútbol 7</option>
                            <option value="basket-norte">Complejo Norte - Basket</option>
                            <option value="padel-center">Padel Center</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>
                    <div class="form-group">
                        <label for="hora">Hora:</label>
                        <input type="time" id="hora" name="hora" required min="09:00" max="23:00">
                    </div>
                </fieldset>
                
                <br>
                <button type="submit">Realizar Reserva</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 CanchaMaster.</p>
        </div>
    </footer>
</body>
</html>
