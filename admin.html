<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrador</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-panel { padding: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: var(--primary-color); color: white; }
        .btn-danger { background: #d9534f; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="container nav-container">
            <a href="#" class="logo">ADMINISTRACIÓN 🛡️</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Salir</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container admin-panel">
        
        <section class="card" style="margin-bottom: 2rem; padding: 20px; background: white; border-radius: 12px;">
            <h2>👷 Agregar Nuevo Empleado</h2>
            <form action="/api/admin/add_empleado" method="POST" class="form-row">
                <input type="text" name="nombre" placeholder="Nombre" required class="form-control">
                <input type="email" name="email" placeholder="Email" required class="form-control">
                <input type="password" name="password" placeholder="Contraseña" required class="form-control">
                <button type="submit" class="btn btn-primary">Crear Empleado</button>
            </form>
            
            <h3 style="margin-top: 20px;">Lista de Empleados</h3>
            <table id="tabla-empleados">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section class="card" style="padding: 20px; background: white; border-radius: 12px;">
            <h2>📅 Todas las Reservaciones</h2>
            <table id="tabla-reservas">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Cancha</th>
                        <th>Fecha/Hora</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

    </main>
    <script src="js/dashboard.js"></script>
</body>
</html>
